name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (format + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Check formatting and run tests
        run: mvn -B -ntp spotless:check verify

  notification-service:
    name: Notification service (format + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notification-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Check formatting and run tests
        run: mvn -B -ntp spotless:check verify

  frontend:
    name: Frontend (format + lint + unit tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NG_CLI_ANALYTICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Check formatting
        run: npx prettier --check "src/**/*.{ts,html,scss}"
      - name: Lint
        run: npx eslint "src/**/*.ts" "src/**/*.html"
      - name: Unit tests
        run: npx ng test --watch=false
      - name: Production build
        run: npx ng build --configuration production
