@if (user$ | async; as user) {
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">K</span>
        <div>
          <b>Kaka</b>
          <small>Student Management</small>
        </div>
      </div>
      <button class="btn btn-ghost" type="button" (click)="signOut()">
        <i class="ph ph-sign-out" aria-hidden="true"></i>Sign out
      </button>
    </header>

    <main class="content">
      <p class="area">{{ areaByRole[user.role] }}</p>
      <h1>Welcome, {{ user.firstName }}.</h1>
      <dl class="who">
        <div>
          <dt>Name</dt>
          <dd>{{ user.firstName }} {{ user.lastName }}</dd>
        </div>
        <div>
          <dt>Email</dt>
          <dd>{{ user.email }}</dd>
        </div>
        <div>
          <dt>Role</dt>
          <dd data-testid="role">{{ user.role }}</dd>
        </div>
      </dl>
    </main>

    <footer><span class="studio-mark">Kaka Studio</span></footer>
  </div>
}
